version: '3.8'

# Development overrides for docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  mongodb:
    ports:
      - "27017:27017"

  server:
    environment:
      NODE_ENV: development
    volumes:
      - ./server:/app
      - /app/node_modules
    command: npm run dev

  client:
    environment:
      NODE_ENV: development
    volumes:
      - ./client:/app
      - /app/node_modules
    command: npm run dev
    ports:
      - "3000:5173"
